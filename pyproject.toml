[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verse-archive-toolkit"
version = "0.1.0"
description = "A CLI toolkit for building curated poetry and philosophy quote archives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
]
authors = [
  { name = "8tnomasu" },
]
keywords = ["poetry", "quotes", "dataset", "archive", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.scripts]
verse-archive = "verse_archive_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
