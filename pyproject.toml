[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verse-archive-toolkit"
version = "0.3.0"
description = "Desktop and CLI tools for building, reviewing, and translating verse archives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "platformdirs>=3.8,<4",
  "PySide6>=6.7,<7",
  "requests>=2.31,<3",
]
authors = [
  { name = "8tnomasu" },
]
keywords = ["poetry", "quotes", "dataset", "archive", "cli", "desktop", "gui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.scripts]
verse-archive = "verse_archive_toolkit.cli:main"

[project.gui-scripts]
verse-archive-gui = "verse_archive_toolkit.builder_gui_entry:main"
verse-archive-translator = "verse_archive_toolkit.translator_gui_entry:main"

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.19,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
